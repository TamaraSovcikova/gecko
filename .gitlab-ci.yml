# Slowly changing it to match our project specs
# Stages - lint, build, deploy
# Lint - re-installs npm dependencies and runs lint
# unit test stage - commented out for now
#
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/development/cicd/templates/
# This specific (default) template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml

stages:          # List of stages for jobs, and their order of execution
  - lint
  - build
  - deploy

lint:          # lint stage
  stage: lint
  image: node:18
  script:
    - cd server
    - npm install
    - npm run lint
    - cd ../client
    - npm install
    - npm run lint
  allow_failure: true

build:       # This job runs in the build stage, which runs first.
  stage: build  # only runs if lint passes
  image: node:18
  script:
    - cd client
    - npm install
    - npm run build

deploy:
  stage: deploy
  script:
    - cd ~/COM2042_Zoar_App
    - git pull origin main
    - ./start.sh
  only:
    - main
  tags:
    - vm
