name: Deploy

# Runs on every push to main, or manually via workflow_dispatch.
# CI (lint + test) runs in parallel — this does not wait for it.
# Two secrets required in GitHub repo settings:
#   CLOUDFLARE_API_TOKEN  — CF API token with Pages:Edit permission
#   CLOUDFLARE_ACCOUNT_ID — CF account ID (dashboard URL: /home shows it)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-client:
    name: Build + deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        run: npm run build
        env:
          VITE_API_URL: https://gecko-uhqc.onrender.com
          VITE_FIREBASE_API_KEY: AIzaSyAlTMlBRiH5DvgysviWCYtfcm5KCqX4jyU
          VITE_FIREBASE_AUTH_DOMAIN: zoar-eed92.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: zoar-eed92
          VITE_FIREBASE_STORAGE_BUCKET: zoar-eed92.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "812712742589"
          VITE_FIREBASE_APP_ID: 1:812712742589:web:b7dac925e379ec2630f1d4

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy client/dist --project-name gecko-client --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
